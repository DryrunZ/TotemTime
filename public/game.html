// hold-to-repeat for radio tune: apply the frequency step directly, no .click()
(function(){
  let iv=null, to=null;
  function stepOnce(id, dir){
    const c=findComp(id), p=(c&&c.params)||{};
    const delta=(p.step??1)*dir;
    W[id]=Math.min(p.max??Infinity, Math.max(p.min??-Infinity,(W[id]??0)+delta));
    const rf=document.getElementById('rf_'+id);
    if(rf) rf.textContent=W[id];
  }
  function down(e){
    const btn=e.target.closest("[data-wstep]"); if(!btn) return;
    e.preventDefault();                       // stop text-selection / callout on hold
    const id=btn.dataset.el, dir=Number(btn.dataset.wstep);
    if(!id) return;
    to=setTimeout(()=>{ iv=setInterval(()=>stepOnce(id,dir),60); },300);
  }
  function up(){ if(to){clearTimeout(to);to=null;} if(iv){clearInterval(iv);iv=null;} }
  document.addEventListener("pointerdown",down,true);
  document.addEventListener("pointerup",up,true);
  document.addEventListener("pointercancel",up,true);
})();

// wstep contextmenu guard: block the native long-press menu on tune buttons
document.addEventListener("contextmenu",function(e){ if(e.target.closest("[data-wstep]")) e.preventDefault(); });

// forcetouch guard: block macOS Force Touch "Look Up" on controls so hold-to-repeat works
["webkitmouseforcewillbegin","webkitmouseforcedown","webkitmouseforceup","webkitmouseforcechanged"].forEach(function(ev){
  document.addEventListener(ev,function(e){ if(e.target.closest && e.target.closest("[data-wstep],[data-tstation],.chip,.gkey")) e.preventDefault(); });
});
window.__holdWired2=true;
</script>

.tloco{position:absolute;left:150px;top:125px;font-size:26px;transition:transform .04s linear;will-change:transform;margin:-16px 0 0 -16px}

.ttrack2{position:relative;margin:6px auto}
.rail-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rail-line{fill:none;stroke:#4a4a52;stroke-width:2.5}
.rail-tie{stroke:#3a3a42;stroke-width:3}
.ttrack2 .tstation{position:absolute;transform:translate(-50%,-50%);min-width:36px;min-height:36px;border-radius:50%;
  border:2px solid #55555f;background:#15151a;color:#cfcfd4;font-weight:800;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;z-index:3;-webkit-tap-highlight-color:transparent;
  transition:transform .18s, border-color .18s, box-shadow .18s}
.ttrack2 .tstation.here{transform:translate(-50%,-50%) scale(1.4);border-color:var(--tt-accent);
  background:#242a12;color:var(--tt-accent);box-shadow:0 0 20px rgba(200,238,91,.6)}
.ttrack2 .tstation.tapped{transform:translate(-50%,-50%) scale(1.55)}
.tloco2{position:absolute;width:78px;height:auto;z-index:2;transform-origin:center;
  transition:transform .05s linear;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));pointer-events:none}
.calc-w .numpad4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.calc-w .gkey{min-height:48px;font-size:18px}.calc-w .gkey.op{background:#2a2410;color:#ffb347}.calc-w .gkey.clr{background:#2a1414;color:#ff8a8a}.calc-enter{width:100%;margin-top:10px}
.fish-w{padding:6px 0;display:flex;justify-content:center}
.bowl2{position:relative;width:260px;height:200px;border-radius:50%/46%;background:radial-gradient(ellipse at 50% 40%,rgba(120,180,210,.18),rgba(40,70,90,.28));border:3px solid rgba(150,200,220,.28);overflow:hidden;cursor:pointer}
.bowl2.done{display:flex;align-items:center;justify-content:center}
.fishsprite{position:absolute;width:64px;height:auto;transition:left .5s cubic-bezier(.3,.7,.3,1),top .5s cubic-bezier(.3,.7,.3,1),transform .5s cubic-bezier(.3,.7,.3,1);pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.fdigits{font-size:40px;font-weight:800;letter-spacing:6px;color:var(--tt-accent,#ffb347)}

.fishbtns-w{padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.fb-shape{font-size:20px;font-weight:800;color:var(--tt-text);text-transform:capitalize;letter-spacing:1px}
.fb-shape.dim{color:var(--tt-muted,#777)}
.fb-row{display:flex;gap:16px}
.fishbtns-w .cbtn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fishbtns-w .cbtn:active{transform:scale(.92)}
.cbtn.black{background:#1a1a1a}.cbtn.blue{background:#2563eb}.cbtn.yellow{background:#eab308}
.fb-done{font-size:44px;color:var(--tt-accent,#ffb347)}

.fishsprite.drift{transition:none;animation:fishdrift 6s ease-in-out infinite}
.fishsprite.d0{animation-duration:5.5s;animation-delay:0s}
.fishsprite.d1{animation-duration:7s;animation-delay:-2s}
.fishsprite.d2{animation-duration:6.3s;animation-delay:-4s}
.fishsprite.d3{animation-duration:7.5s;animation-delay:-1s}
@keyframes fishdrift{
  0%{transform:translate(-50%,-50%) rotate(-8deg)}
  25%{transform:translate(-38%,-58%) rotate(6deg)}
  50%{transform:translate(-52%,-42%) rotate(-4deg)}
  75%{transform:translate(-62%,-55%) rotate(8deg)}
  100%{transform:translate(-50%,-50%) rotate(-8deg)}
}
.clock-w{padding:6px 0}.clock-w .clockrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.clock-w .clockrow .chip{min-height:46px}.clock-w .clockgo{width:100%;margin-top:10px}.laptop-w{padding:8px 0}.laptop-w .glyphgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.laptop-w .symkey{min-height:56px;font-size:24px;transition:transform .12s,background .12s}.laptop-w .symkey.pressed{transform:scale(.9);background:var(--tt-accent);color:#111}.cal-w{padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:12px}.cal-page{width:220px;border-radius:12px;overflow:hidden;background:#0a0a0c;border:1px solid var(--tt-border)}.cal-photo{width:100%;height:180px;object-fit:cover;display:block}.cal-date{text-align:center;font-size:20px;font-weight:800;letter-spacing:2px;padding:10px 0}.cal-date.special{color:#c9a4ff}.cal-nav{display:flex;align-items:center;gap:16px}.cal-nav .chip{min-width:52px;font-size:22px}.cal-count{font-size:13px;color:var(--tt-muted);min-width:44px;text-align:center}.nb-w{padding:10px 0;display:flex;justify-content:center}.nbpaper2{background:#efe9d8;border-radius:8px;padding:20px 30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 12px rgba(0,0,0,.4)}.nbpaper2.blank{color:#b0a890;font-size:22px;letter-spacing:6px;padding:34px}.nbrow{display:flex;justify-content:center}.nbline{width:60px;height:12px;border-radius:3px;background:#111}.nbsq{width:44px;height:44px;border-radius:4px;background:#2563eb}.nbtri{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:44px solid #eab308}.book-w{padding:12px 0;display:flex;justify-content:center}.bookclosed{width:70px;height:90px;background:linear-gradient(135deg,#6b3410,#8a4518);border-radius:4px 8px 8px 4px;border-left:6px solid #4a2409;box-shadow:0 4px 12px rgba(0,0,0,.5)}.bookopen{background:#f3ead2;border-radius:8px;padding:24px 30px;box-shadow:0 4px 14px rgba(0,0,0,.4)}.bookorder{font-size:32px;letter-spacing:8px;color:#2a2a2a}.chip,[data-wstep],.gkey,.cbtn,.deskspot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}</style>
</head>
<body>
<div class="dev">
  <div class="g"><span>מצב</span><button data-mode="player">שחקן</button><button data-mode="admin">אדמין</button></div>
  <div class="g"><span>שפה</span><button data-lang="he">עברית</button><button data-lang="en">EN</button></div>
  <div class="g" id="playerPick"><span>שחקן</span><button data-player="1">1</button><button data-player="2">2</button><button data-player="3">3</button></div>
  <div class="g"><span>שלב</span><button data-stepprev>‹</button><span id="stepLabel" style="min-width:1.2rem;text-align:center">1</span><button data-stepnext>›</button></div>
</div>
<div id="app"></div>
<div id="lightbox" class="lb"><img id="lbimg" alt=""/></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { firebaseConfig } from "./config.js";
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const judge = httpsCallable(getFunctions(fbApp), "judge");
const auth = getAuth(fbApp);
const QS = new URLSearchParams(location.search);
const GAME_ID = QS.get("game") || "kidnapped-il";
const DEVFLAG = QS.get("dev") === "1";
window.__judge = (data) => judge({ gameId: GAME_ID, roomCode: ROOM_CODE, ...data }).then(r => (console.log(r.data), r.data));
const ROOM_CODE = QS.get("room") || QS.get("code") || "dev";
let SEAT_ID = null;
let CUST = {}, CUST_LOADED = false;
function cz(str){
  if (!str) return str;
  for (const f of ((S.game && S.game.customizable) || [])) {
    if (f.type !== "text") continue;
    str = str.split("{"+f.key+"}").join(CUST[f.key] || (f.default_key ? t(f.default_key) : "") || f.default || "");
  }
  return str;
}
function applyCustImages(){
  if (!S.game) return;
  for (const st of S.game.steps || []) for (const c of st.components || []) {
    if (c.cust_key && CUST[c.cust_key]) c.src = CUST[c.cust_key];
  }
}
let MY_NAME = "";
const S = { game:null, loc:{}, mode:"player", lang:"he", player:1, step:0, popup:null, elapsed:0, running:false, countdown:3, points:100, phase:null, seats:{}, flags:{}, prog:{}, hintsUsed:{}, hintOpen:false, dismissed:null, popupId:null };
if(new URLSearchParams(location.search).get("dev")==="1"){ window.S=S; }
const app = document.getElementById("app");
const lb = document.getElementById("lightbox");
const W = {};
const TRAINS = {};
let pausedVideo = null;
const t = (k)=>{
  const def = (S.game && S.game.defaultLanguage) || "he";
  const cur = S.loc[S.lang] && S.loc[S.lang][k];
  if(cur!==undefined) return cur;
  const d = S.loc[def] && S.loc[def][k];
  return d===undefined ? "" : d;
};
const vis = (c,n)=> c.visibleTo==="all" || (Array.isArray(c.visibleTo)&&c.visibleTo.includes(n));
const flag = (x)=> !!(S.flags && S.flags[x]);
const curStep=()=>{ const st=(S.game&&S.game.steps&&S.game.steps[S.step])||{}; if(st.uses){ const base=S.game.steps.find(x=>x.id===st.uses); if(base) return base; } return st; };
const elid = (c)=> c.elementId || c.id;
function calcApply(a,b,op){ a=(a==null?0:a); if(op=='+')return a+b; if(op=='-')return a-b; if(op=='*')return a*b; if(op=='/')return (b==0?0:a/b); return b; }
function findComp(id){
  for(const st of (S.game && S.game.steps)||[]) for(const c of st.components||[]) if(c.id===id||c.elementId===id) return c;
  return null;
}
function blockerId(){
  const st=(S.game&&S.game.steps&&S.game.steps[S.step])||{};
  return (st.chain||[]).find(id=>!flag(id)) || null;
}
async function boot(){
  const g = await getDoc(doc(db,"games",GAME_ID));
  if(!g.exists()){ app.innerHTML="<p style='padding:2rem'>לא נמצא משחק. הריצו את סקריפט הזריעה תחילה.</p>"; return; }
  S.game=g.data();
  if(window.S) console.log("STEPS:", S.game.steps.map(x=>x.id).join(" | "));
  for(const l of ["he","en"]){ const s=await getDoc(doc(db,"games",GAME_ID,"locales",l)); S.loc[l]=s.exists()?s.data():{}; }
  tickCountdown();
}
function tickCountdown(){
  if(S.countdown===null){ render(); return; }
  render();
  if(S.countdown<=1){ setTimeout(()=>{ S.countdown=null; S.running=true; render(); },900); return; }
  setTimeout(()=>{ S.countdown--; tickCountdown(); },900);
}
setInterval(()=>{ if(S.running){ S.elapsed++; const el=document.getElementById("timer"); if(el) el.textContent=fmt(S.elapsed);} },1000);
function fmt(s){const m=Math.floor(s/60),ss=s%60,p=n=>String(n).padStart(2,"0");return p(m)+":"+p(ss);}
function submitEl(id,val,btn){
  if(btn) btn.disabled=true;
  return judge({ action:"submitElement", gameId:GAME_ID, roomCode:ROOM_CODE, elementId:id, value:val })
    .then((res)=>{ if(res.data.miss){ W["_flash_"+id]=Date.now(); } return res.data; })
    .catch((err)=>{ console.error("submitElement",id,err); })
    .finally(()=>{ if(btn) btn.disabled=false; render(); });
}
/* ---------- widget renderers ---------- */

const D3PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const D3FACE={1:'d3-f1',2:'d3-f2',3:'d3-f3',4:'d3-f4',5:'d3-f5',6:'d3-f6'};
const D3TARGET={1:{x:0,y:0},2:{x:0,y:-90},3:{x:-90,y:0},4:{x:90,y:0},5:{x:0,y:90},6:{x:0,y:180}};
function d3FaceHTML(n){let c='';for(let i=1;i<=9;i++)c+=D3PIPS[n].includes(i)?'<div class="d3-pip"></div>':'<div></div>';return c;}
function d3CubeHTML(id,px,face){
  face=face||1;const t=D3TARGET[face];
  let faces='';for(let n=1;n<=6;n++)faces+='<div class="d3-face '+D3FACE[n]+'">'+d3FaceHTML(n)+'</div>';
  return '<div class="d3" style="--ds:'+px+'px"><div class="d3-tilt"><div class="d3-cube" id="'+id+'" data-face="'+face+'" style="transform:rotateX('+t.x+'deg) rotateY('+t.y+'deg)">'+faces+'</div></div></div>';
}

function wcomp(c, inter){
  const id=elid(c), done=flag(id), dis=inter?"":"disabled";
  const locked = c.enabledWhen && !flag(c.enabledWhen);
  if (c.showWhen && !flag(c.showWhen)) return "";
  const prog=(S.prog&&S.prog[id])||[];
  const fl=(W["_flash_"+id]&&Date.now()-W["_flash_"+id]<600)?"flash":"";
  const shell=(inner)=>c.bare?`<div class="wdg ${done?'done':''} ${locked?'locked':''} ${fl}" id="w_${c.id}">${inner}</div>`:`<div class="wdg ${done?'done':''} ${locked?'locked':''} ${fl}" id="w_${c.id}">
    <p class="wname">${t(c.name_key)} ${done?'✓':''}${locked?' 🔒':''}</p>${inner}
    ${c.caption_key?`<p class="wcap">${cz(t(c.caption_key))}</p>`:""}</div>`;
  const pips=(total)=>`<div class="pips">${Array.from({length:total},(_,i)=>`<span class="pip ${i<prog.length?'on':''}"></span>`).join("")}</div>`;

  if(c.widget==="stepper"){
    const p=c.params||{};
    if(!(id in W)) W[id]=(c.id==="radio"?1124:(p.start??p.min??950));
    if(!(id+"_band" in W)) W[id+"_band"]="FM";
    if(W["_sweep_"+id]){ W["_sweep_"+id]=false; const target=W[id];
      setTimeout(()=>{ const rf=document.getElementById('rf_'+id); if(!rf) return;
        let v=Math.max((p.min??875), target-60), step=0;
        const iv=setInterval(()=>{ v+=3; step++; if(v>=target){v=target;clearInterval(iv);} rf.textContent=v; }, 22);
      }, 80); }
    const band=W[id+"_band"], freq=done?1125:W[id];
    return `<div class="radio-w">
      <div class="radio-band">
        <button class="rb ${band==='AM'?'on':''}" id="rb_AM_${id}" data-band="AM" data-el="${id}" ${dis}>AM</button>
        <button class="rb ${band==='FM'?'on':''}" id="rb_FM_${id}" data-band="FM" data-el="${id}" ${dis}>FM</button>
      </div>
      <div class="radio-dial ${done?'done':''}"><span class="rf" id="rf_${id}">${freq}</span></div>
      ${done?"":`<div class="row">
        <button class="chip rtune" data-wstep="-1" data-el="${id}" ${dis}>−</button>
        <button class="chip rtune" data-wstep="1" data-el="${id}" ${dis}>+</button>
      </div>
      <button class="cta radio-on" data-wcommit data-el="${id}" ${dis}>ON</button>`}
    </div>`;
  }
  if(c.widget==="voice"){
    const p=c.params||{};
    return shell(`<button class="chip" style="width:100%" data-voice="${p.say||''}" ${p.src?`data-audio="${p.src}"`:""} ${dis}>${t("el.audio.play")}</button>`);
  }
  if(c.widget==="gallery"){
    const p=c.params||{};
    const four=flag(p.show4When);
    const base='assets/games/vault-exe/';
    const pages=[
      {img:base+'cal-1.png', date:(p.dates||[])[0]||'', special:false},
      {img:base+'cal-2.png', date:(p.dates||[])[1]||'', special:false},
      {img:base+'cal-3.png', date:(p.dates||[])[2]||'', special:false},
    ];
    if(four) pages.push({img:base+'cal-4.png', date:p.hidden4||'', special:true});
    if(!(id+"_pg" in W)) W[id+"_pg"]=0;
    if(W[id+"_pg"]>=pages.length) W[id+"_pg"]=0;
    const pg=pages[W[id+"_pg"]];
    return `<div class="cal-w"><div class="cal-page"><img class="cal-photo" id="calimg_${id}" src="${pg.img}" alt="" draggable="false"><div class="cal-date ${pg.special?'special':''}" id="caldate_${id}">${pg.date}</div></div><div class="cal-nav"><button class="chip" data-calflip="-1" data-el="${id}" ${dis}>‹</button><span class="cal-count" id="calcount_${id}">${W[id+"_pg"]+1} / ${pages.length}</span><button class="chip" data-calflip="1" data-el="${id}" ${dis}>›</button></div></div>`;
  }
  if(c.widget==="lamp"){
    if(!(id+"_st" in W)) W[id+"_st"]=0;
    const canUV=flag("calc"), uvDone=flag("uv");
    const states=canUV?["off","small","big","uvon"]:["off","small","big"];
    if(W[id+"_st"]>=states.length) W[id+"_st"]=0;
    const st=uvDone?"uvon":states[W[id+"_st"]];
    return shell(`<div class="lamparea">
      <div class="lampbulb ${st}" data-lampcycle data-el="${c.id}" role="button"></div>
    </div>`);
  }
  if(c.widget==="symbols"){
    const p=c.params||{}, g=p.glyphs||{};
    const keys=Object.keys(g).map(k=>`<button class="gkey symkey" data-symkey data-el="${id}" data-val="${k}" ${dis}>${g[k]}</button>`).join("");
    return `<div class="laptop-w"><div class="glyphgrid">${keys}</div></div>`;
  }
  if(c.widget==="artifact"){
    const p=c.params||{};
    return `<div class="wdg" style="opacity:.85"><button class="chip" style="width:100%;font-size:26px;background:none;border:none" data-artifact="${c.quip_key}">${p.emoji||"🎁"}</button></div>`;
  }
  if(c.widget==="roller"){
    const p=c.params||{}, seq=p.fixedSequence||[1,1,2,5];
    if(!(id in W)) W[id]=0;
    const face = W[id] ? seq[(W[id]-1)%seq.length] : 1;   // face shown for current roll
    if(W["_autoroll_"+id]){ W["_autoroll_"+id]=false;
      setTimeout(()=>{ const cube=document.getElementById('cube_'+id); if(!cube) return;
        const t2=D3TARGET[face]; const sx=(2+Math.floor(Math.random()*2))*360; const sy=(2+Math.floor(Math.random()*2))*360;
        cube.style.transition='none'; cube.style.transform='rotateX('+(sx+t2.x)+'deg) rotateY('+(sy+t2.y)+'deg)';
        void cube.offsetWidth;
        cube.style.transition='transform .9s cubic-bezier(.18,.7,.3,1)'; cube.style.transform='rotateX('+t2.x+'deg) rotateY('+t2.y+'deg)'; }, 60);
    }
    return `<div class="dice-bare" data-roll data-el="${id}" role="button" aria-label="${t(c.name_key)}">${d3CubeHTML('cube_'+id, 104, face)}</div>`;
  }
  if(c.widget==="train"){
    const p=c.params||{}, chars=p.trackChars||[];
    const CX=160, CY=140, RX=130, RY=100;
    const angs = p.stationAngles || chars.map((_,i)=>-90+i*(360/chars.length));
    if(!TRAINS[id]) TRAINS[id]={ start:Date.now(), chars, angs, seg:0, phaseStart:Date.now(), phase:'pause',
      moveMs:(p.moveMs||1400), pauseMs:(p.pauseMs||1100), rx:RX, ry:RY, cx:CX, cy:CY };
    if(!(id+"_taps" in W)) W[id+"_taps"]=[];
    // SVG rail: outer + inner ellipse = two rails; ties as short radial lines
    let ties="";
    for(let d=0; d<360; d+=12){ const r=d*Math.PI/180;
      const x1=CX+(RX-7)*Math.cos(r), y1=CY+(RY-7)*Math.sin(r);
      const x2=CX+(RX+7)*Math.cos(r), y2=CY+(RY+7)*Math.sin(r);
      ties+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="rail-tie"/>`; }
    const rail=`<svg class="rail-svg" viewBox="0 0 320 280">
      <ellipse cx="${CX}" cy="${CY}" rx="${RX+7}" ry="${RY+7}" class="rail-line"/>
      <ellipse cx="${CX}" cy="${CY}" rx="${RX-7}" ry="${RY-7}" class="rail-line"/>
      ${ties}</svg>`;
    const stations = chars.map((ch,i)=>{
      const r=angs[i]*Math.PI/180, x=CX+RX*Math.cos(r), y=CY+RY*Math.sin(r);
      return `<button class="tstation" id="st_${id}_${i}" data-tstation data-el="${id}" data-ci="${i}" style="left:${x}px;top:${y}px" ${dis}>${ch}</button>`;
    }).join("");
    return `<div class="train-w"><div class="ttrack2" data-train="${id}" style="width:320px;height:280px">
      ${rail}${stations}
      ${flag("radio")?`<button data-voice data-audio="assets/games/vault-exe/train.mp3" style="position:absolute;left:160px;top:140px;transform:translate(-50%,-50%);background:none;border:none;font-size:30px;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent">&#x1F50A;</button>`:""}
      <img class="tloco2" id="loco_${id}" src="assets/games/vault-exe/loco.png?v=2" alt="" draggable="false">
    </div></div>`;
  }
  if(c.widget==="reveal"){
    const p=c.params||{};
    return shell(`<div style="font-size:44px">${p.emoji||"✨"}</div>`);
  }
  if(c.widget==="fishbtns"){
    const p=c.params||{}, colors=p.colors||["black","blue","yellow"];
    const from=(p.shapeFrom||"fish")+"_shape";
    const shape=(S.prog&&S.prog[from])||null;
    if(done) return `<div class="fishbtns-w"><div class="fb-done">✓</div></div>`;
    const btns=colors.map(col=>`<button class="cbtn ${col}" data-fishbtn data-el="${elid(c)}" data-col="${col}"></button>`).join("");
    const label=shape?`<div class="fb-shape" id="fbshape_${elid(c)}">${shape}</div>`:`<div class="fb-shape dim" id="fbshape_${elid(c)}">—</div>`;
    return `<div class="fishbtns-w">${label}<div class="fb-row">${btns}</div></div>`;
  }
  if(c.widget==="fish"){
    const p=c.params||{}, forms=p.formations||["line","square","triangle"];
    if(!(id+"_f" in W)) W[id+"_f"]=0;
    const form=forms[W[id+"_f"]];

  }

    if(!(id+"_disp" in W)){ W[id+"_disp"]="0"; W[id+"_acc"]=null; W[id+"_op"]=null; W[id+"_fresh"]=true; }
    const rows=[["C","/","*","-"],["7","8","9","+"],["4","5","6","="],["1","2","3","0"]];

function trainPausedAt(id){ const tr=TRAINS[id]; if(!tr||tr.phase!=='pause') return -1; return tr.seg; }
function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
setInterval(()=>{
  const now=Date.now();
  for(const id of Object.keys(TRAINS)){
    const tr=TRAINS[id];
    const box=document.querySelector(`.ttrack2[data-train="${id}"]`);
    const loco=document.getElementById('loco_'+id);
    const el=now-tr.phaseStart;
    if(tr.phase==='pause' && el>=tr.pauseMs){ tr.phase='move'; tr.phaseStart=now; }
    else if(tr.phase==='move' && el>=tr.moveMs){ tr.phase='pause'; tr.phaseStart=now; tr.seg=(tr.seg+1)%tr.angs.length; }
    if(!box||!loco) continue;
    let ang;
    if(tr.phase==='pause'){ ang=tr.angs[tr.seg]; }
    else { const a0=tr.angs[tr.seg], a1=tr.angs[(tr.seg+1)%tr.angs.length];
      let d=((a1-a0)%360+360)%360; if(d>180) d-=360;
      ang=a0 + d*easeInOut(Math.min(1,el/tr.moveMs)); }
    const r=ang*Math.PI/180;
    const x=tr.cx+tr.rx*Math.cos(r), y=tr.cy+tr.ry*Math.sin(r);
    // tangent angle on the ellipse for facing direction of travel
    const tx=-tr.rx*Math.sin(r), ty=tr.ry*Math.cos(r);
    let deg=Math.atan2(ty,tx)*180/Math.PI;   // travel direction
    // sprite faces RIGHT by default; add 180 so nose leads (loco art points right = front)
    loco.style.left=x+'px'; loco.style.top=y+'px';
    loco.style.transform=`translate(-50%,-50%) rotate(${deg}deg)`;
    const pausedIdx=trainPausedAt(id);
    box.querySelectorAll('.tstation').forEach((stEl,i)=>stEl.classList.toggle('here', i===pausedIdx));
  }
},40);

    }).catch((err)=>{

  if (typeof prevPoints === "number" && r.points !== prevPoints) floatPoints(r.points - prevPoints);
  prevPoints = r.points;

    S.popupId = r.popup.id;

    const solver = p.solver || (S.lang==='he'?'חבר צוות':'a teammate');
    const pbody = (k)=> (k?cz(t(k)):"").split("{player_name}").join(solver);
    S.popup = p.kind === "win" ? { kind:"win", title:t("win.title"), body:pbody(p.bodyKey), cta:t("win.cta") }
