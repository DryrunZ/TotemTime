<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TotemTime — Engine</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; font-family:-apple-system,system-ui,sans-serif; background:#0f1115; color:#e8e8ea; padding:1.25rem; }
    #meta { text-align:center; color:#9aa0aa; font-size:.85rem; margin-bottom:1rem; }
    .controls { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; margin-bottom:1.25rem; }
    .group { display:flex; align-items:center; gap:.25rem; background:#1a1d24; border:1px solid #2a2e38; border-radius:.6rem; padding:.3rem; }
    .group > span { font-size:.7rem; color:#6b7280; padding:0 .35rem; }
    button { background:#232733; color:#e8e8ea; border:1px solid #333846; border-radius:.45rem; padding:.4rem .7rem; font-size:.9rem; cursor:pointer; }
    button.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
    #stage { max-width:30rem; margin:0 auto; }
    #stage h3 { font-size:.95rem; margin:1rem 0 .5rem; }
    #stage h3.muted { color:#6b7280; font-weight:500; }
    .card { background:#1a1d24; border:1px solid #2a2e38; border-radius:.7rem; padding:1rem; margin-bottom:.6rem; font-size:1.05rem; }
    .card.img { color:#9aa0aa; font-size:.85rem; display:flex; gap:.5rem; align-items:center; }
    .card input { width:100%; padding:.6rem; margin-bottom:.5rem; background:#0f1115; border:1px solid #333846; border-radius:.45rem; color:#e8e8ea; }
    .card button.big { width:100%; padding:.7rem; font-size:1rem; }
    .ghost { border:1px dashed #333846; border-radius:.5rem; padding:.5rem .8rem; margin-bottom:.4rem; color:#5b616b; font-size:.8rem; }
    .dim { color:#5b616b; }
  </style>
</head>
<body>
  <div id="meta">loading…</div>
  <div class="controls">
    <div class="group"><span>Player</span><button data-player="1">1</button><button data-player="2">2</button><button data-player="3">3</button></div>
    <div class="group"><span>Lang</span><button data-lang="he">עברית</button><button data-lang="en">EN</button></div>
    <div class="group"><span>Step</span><button data-step="0">1</button><button data-step="1">2</button></div>
  </div>
  <div id="stage"></div>
  <script type="module" src="./render.js"></script>
</body>
</html>
